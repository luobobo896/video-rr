# 影巢 · nginx 子路径配置片段（由 install-hk.sh 注入现有 server 块）
# C 端：/video/    后台：/video-admin/    媒体：/video/media/**    无直播模块

# ---------- C 端 ----------
location = /video { return 301 /video/; }

location /video/api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store";
}

# HLS：通过 auth_request 调 Node 校验播放签名（Cookie 或 ?sign=&expires=）
location = /video/_auth_media {
    internal;
    proxy_pass http://127.0.0.1:8787/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
}

location ~ ^/video/media/hls/(?<hls_tail>.+)$ {
    auth_request /video/_auth_media;
    error_page 401 403 = @hls_denied;

    alias /opt/video-rr/storage/hls/$hls_tail;
    sendfile on;
    tcp_nopush on;
    aio threads;
    keepalive_timeout 65;
    # 缓存必须短于签名有效期，否则过期后仍可能命中缓存绕过校验
    add_header Cache-Control "private, max-age=60";
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
    access_log off;
}

location @hls_denied {
    return 403 "403 播放链接无效或已过期";
}

location /video/media/uploads/ {
    # 源片（mp4）不对外直出：播放只走带签名的 HLS，避免整片被批量拖走
    return 403;
}

# 其它媒体路由（占位图 SVG 等）交给 Node
location /video/media/ {
    proxy_pass http://127.0.0.1:8787/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
}

# 站点素材（镜像后的封面/横幅）
location /video/media/images/ {
    alias /opt/video-rr/storage/images/;
    sendfile on;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# 收银台页面（模拟支付宝 / 模拟支付）由 Node 渲染
location /video/pay/ {
    proxy_pass http://127.0.0.1:8787/pay/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
}

location /video/ {
    alias /opt/video-rr/public/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ---------- 后台 ----------
location = /video-admin { return 301 /video-admin/; }

location /video-admin/api/ {
    proxy_pass http://127.0.0.1:8787/admin/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store";
}

location /video-admin/ {
    alias /opt/video-rr/admin/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
