# 影巢 · nginx 子路径配置片段（由 install-hk.sh 注入现有 server 块）
# C 端：/video/    后台：/video-admin/    媒体：/video/media/**    直播：/video/live/**

# ---------- C 端 ----------
location = /video { return 301 /video/; }

location /video/api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store";
}

# HLS：nginx 直接吐文件（Node 不参与视频字节），带长缓存
location /video/media/hls/ {
    alias /opt/video-rr/storage/hls/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    directio 4m;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
    access_log off;
}

location /video/media/uploads/ {
    alias /opt/video-rr/storage/uploads/;
    sendfile on;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
}

# 站点素材（镜像后的封面/横幅）
location /video/media/images/ {
    alias /opt/video-rr/storage/images/;
    sendfile on;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# 直播 HLS：反代 MediaMTX（127.0.0.1:8890）
location /video/live/ {
    proxy_pass http://127.0.0.1:8890/live/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-cache, no-store";
    access_log off;
}

location /video/ {
    alias /opt/video-rr/public/;
    index index.html;
    add_header Cache-Control "no-cache";
}

# ---------- 后台 ----------
location = /video-admin { return 301 /video-admin/; }

location /video-admin/api/ {
    proxy_pass http://127.0.0.1:8787/admin/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store";
}

location /video-admin/ {
    alias /opt/video-rr/admin/;
    index index.html;
    add_header Cache-Control "no-cache";
}
