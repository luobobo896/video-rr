# 影巢 · nginx 子路径配置片段（由 install-hk.sh 注入现有 server 块）
# C 端：/video/    后台：/video-admin/    媒体：/video/media/**    无直播模块

# HTTP/2：首屏要并发拉 index.html / app.js / styles.css / 首屏海报，1.1 得排队，2 可多路复用
# （nginx ≥ 1.25.1 支持 http2 指令；1.26.3 已确认可用）
#
# 兼容注意：这一行只在站点里没有 `listen 443 ssl http2;` 时才能留。
# 两种写法并存会让 nginx -t 报 "duplicate listen options ... http2" 并拒绝 reload。
# install-hk.sh 安装片段后会检测站点块，发现旧写法就把下面这行删掉（只保留 listen 参数），
# 所以这里写了也别指望它一定在最终配置里出现。
http2 on;

# ---------- C 端 ----------
location = /video { return 301 /video/; }

location /video/api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    # 缓存策略交给 Node：公开聚合接口给 10 秒 private 缓存（返回箭头不用再等一个来回），
    # 订单/支付/播放等仍由 Node 发 no-store，这里不能再统一覆盖成 no-store。
}

# HLS：通过 auth_request 调 Node 校验播放签名（Cookie 或 ?sign=&expires=）
location = /video/_auth_media {
    internal;
    proxy_pass http://127.0.0.1:8787/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
}

location ~ ^/video/media/hls/(?<hls_tail>.+)$ {
    auth_request /video/_auth_media;
    error_page 401 403 = @hls_denied;

    alias /opt/video-rr/storage/hls/$hls_tail;
    sendfile on;
    tcp_nopush on;
    aio threads;
    keepalive_timeout 65;
    # 缓存必须短于签名有效期，否则过期后仍可能命中缓存绕过校验
    add_header Cache-Control "private, max-age=60";
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
    access_log off;
}

location @hls_denied {
    return 403 "403 播放链接无效或已过期";
}

# 外部片源代理：Node 负责拉上游清单/分片并重写，nginx 只做透传（关闭缓冲，边下边发）
location /video/media/remote/ {
    proxy_pass http://127.0.0.1:8787/media/remote/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cache-Control "private, max-age=60";
    access_log off;
}

# 试看：清单由 Node 按秒截断、逐分片校验窗口，链接按访客/账号签短票
# 缓存必须短于签名有效期且不能公共缓存，否则过期后仍会被共享缓存命中
location /video/media/trial/ {
    proxy_pass http://127.0.0.1:8787/media/trial/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    add_header Cache-Control "private, max-age=30";
    access_log off;
}

location /video/media/uploads/ {
    # 源片（mp4）不对外直出：播放只走带签名的 HLS，避免整片被批量拖走
    return 403;
}

# 其它媒体路由（占位图 SVG 等）交给 Node
location /video/media/ {
    proxy_pass http://127.0.0.1:8787/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
}

# 站点素材（镜像后的封面/横幅）
# 图片变体（320/640/1280 宽 WebP）：内容不变、文件名带宽度，可以放心长缓存+immutable。
# 必须写在 /video/media/images/ 之前，nginx 前缀匹配取最长，但这里显式排列更好读。
location /video/media/images/variants/ {
    alias /opt/video-rr/storage/images/variants/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    open_file_cache max=8192 inactive=120s;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location /video/media/images/ {
    alias /opt/video-rr/storage/images/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    open_file_cache max=8192 inactive=120s;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# 收银台页面（模拟支付宝 / 模拟支付）由 Node 渲染
location /video/pay/ {
    proxy_pass http://127.0.0.1:8787/pay/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
}

# 空片段（首屏入口）必须先被精确 location 接走：/video/ 与 /video/index.html 都会命中下面
# 那条正则，$vn_hash 为空就又 302 回 /video/#/ —— 自己跳自己，浏览器 ERR_TOO_MANY_REDIRECTS。
location = /video/ {
    alias /opt/video-rr/dist/client/;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location = /video/index.html {
    alias /opt/video-rr/dist/client/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# 静态文件（favicon / 图标 / base.js 等）单独一条正则，必须排在 SPA 白名单正则之前：
# 同层多条正则按书写顺序取第一个命中的，排在后面就会被白名单里不存在的组合抢走（实测 404）。
# 注意顺序：正则 location 按书写顺序取第一个命中的。上面 entry/pomdoro 之类同级 location
# 用 root 时这里也必须显式 root，否则 try_files 会退回默认 root（/usr/share/nginx/html）。
location ~ ^/video/(?<vn_static>favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon\.png|browserconfig\.xml|base\.js|main\.js|(?:brand|art|icons)/.*) {
    alias /opt/video-rr/dist/client/$vn_static;
    access_log off;
}

# 构建产物带内容哈希，可以长缓存；命中率最高的首屏脚本走这里。
# 顺序硬要求：必须写在下面 /video/(?<vn_hash>...) 之前。同名 server 里多条正则按书写
# 顺序取第一个命中的，反了的话 assets 会先进 SPA 解析块（try_files 虽然也能命中文件，
# 但 MIME 表和 immutable 长缓存就丢了）。
location ~ ^/video/assets/(?<vn_asset>.+)$ {
    # alias 里用命名捕获：直接写 alias .../assets/ 会触发 nginx 的 alias 路径二次拼接，
    # 把 .webmanifest 请求 301 到带斜杠的地址（实测踩过）。
    alias /opt/video-rr/dist/client/assets/$vn_asset;
    default_type application/octet-stream;
    types {
        application/javascript js mjs;
        text/css css;
        image/webp webp;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        image/vnd.microsoft.icon ico;
        font/woff2 woff2;
        application/json json;
        application/manifest+json webmanifest;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# 前端是 hash 路由（build 后 index.html 里资源是 ./assets/xxx 相对路径）：
#   · 静态文件（favicon / icons / base.js）必须原样返回，否则相对路径解析崩；
#   · 真深链（/video/detail/11 这类）才 302 到 /video/#/detail/11，交给前端路由。
# 用正则 + 命名捕获 $vn_hash：try_files 只在 alias 里判存在，不存在才落到 @video_spa，
# 而 $vn_hash 已经裁掉了 /video 前缀，片段才对（不会变成 #/video/detail/11）。
# 匹配范围必须收窄：只吃「像前端路由的路径」，别把 /video/api/、/video/media/、
# /video/pay/ 这些同级的真实后端点吞进来（正则 location 会在同层按书写顺序先命中，
# 一旦吞掉就会把 API 也 302 到 #/api/...，首页直接显示"首页加载失败"——实测踩过）。
# 也正因为匹配面收窄，/video/ 这类空片段根本不会进来，不需要再额外兜死循环。
# 其他踩过的坑：① alias 里直接回 index.html（或 /index.html）会二次拼路径，要么 301
# 要么把所有请求都吐成 SPA 外壳；② 别写 index 指令（/video/ 会被内部重定向再裁成
# #/index.html）；③ if + rewrite 组合会报 "alias cannot be used in location where
# URI was rewritten" 直接 500。几种都实测过。
# 只匹配前端路由形状的路径：detail/11、library、rank、search、plaza、me、play/xx 等。
# 首段白名单写法避免误吞 /video/api/、/video/media/、/video/pay/、/video/assets/。
location ~ ^/video/(?<vn_hash>(?:detail|play|library|rank|search|plaza|posters|upcoming|me|profile-edit|login|lp|adult|short|orders|favorites|history|messages|promotion|member)(/.*)?)$ {
    alias /opt/video-rr/dist/client/;
    # 命中真实文件就直接返回（万一以后有同名静态目录），否则交给 @video_spa 拼 hash。
    try_files /$vn_hash @video_spa;
}

# PWA manifest must not be served as octet-stream (some nginx mime maps omit webmanifest).
location = /video/site.webmanifest {
    alias /opt/video-rr/dist/client/site.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}

# SPA 回退：把深链路径搬进 hash 片段，交给前端路由渲染。
# 前端资源全是相对路径（./assets/index-xxx.js），停在 /video/detail/11 这种多层深链
# 上会解析成 /video/detail/assets/...（白屏），所以这里 302 到 /video/#/detail/11。
# $vn_hash 来自上面正则 location 的命名捕获，已经裁掉 /video 前缀。
location @video_spa {
    return 302 https://$host/video/#/$vn_hash;
}

# ---------- 后台 ----------
location = /video-admin { return 301 /video-admin/; }

location /video-admin/api/ {
    proxy_pass http://127.0.0.1:8787/admin/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store";
}

# 后台入口同理：/video-admin/ 与 /video-admin/index.html 必须先被精确 location 接走，
# 否则空片段会命中下面那条正则，$va_hash 为空又 302 回 /video-admin/#/ —— 自己跳自己。
location = /video-admin/ {
    alias /opt/video-rr/dist/admin/;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /video-admin/index.html {
    alias /opt/video-rr/dist/admin/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

# 后台构建产物：同一套命名捕获 alias + 显式 MIME 表（webmanifest 必须在 types 里，
# 否则 nginx 的 mime.types 没有该扩展名，会按 octet-stream 下发）。
# 和前台一样必须排在 /video-admin/(?<va_hash>...) 之前，否则拿不到长缓存和 MIME 表。
location ~ ^/video-admin/assets/(?<va_asset>.+)$ {
    alias /opt/video-rr/dist/admin/assets/$va_asset;
    default_type application/octet-stream;
    types {
        application/javascript js mjs;
        text/css css;
        image/webp webp;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        font/woff2 woff2;
        application/json json;
        application/manifest+json webmanifest;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}

# 后台也是 hash 路由（资源为 ./assets/xxx 相对路径），深链同样 302 到 #/ 形式。
# 和前台那一块保持同一套写法：正则 + 命名捕获，try_files 判存在，@admin_spa 只负责跳。
# 匹配范围和前台一样收窄成前端路由首段白名单，别用 (?<va_hash>.*)：那会吞掉
# /video-admin/api/ 之类的后端点（虽然 api 块是前缀 location 且写在前面，但收窄更安全）。
location ~ ^/video-admin/(?<va_hash>(?:users|content|comments|feedback|orders|finance|reports|settings|logs|tags|banners|films|episodes|categories|medias|storage|tasks|members|coupons|promotions|analytics|dashboard|login|forbidden)(/.*)?)$ {
    alias /opt/video-rr/dist/admin/;
    try_files /$va_hash @admin_spa;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

# 后台深链同理：管理台也是 hash 路由 + 相对资源路径，直接 302 到 /video-admin/#/users。
# $va_hash 来自上面正则 location 的命名捕获，已裁掉 /video-admin 前缀。
location @admin_spa {
    return 302 https://$host/video-admin/#/$va_hash;
}

location = /video-admin/admin.webmanifest {
    alias /opt/video-rr/dist/admin/admin.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
