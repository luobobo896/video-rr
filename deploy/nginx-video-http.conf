# http 级调优（放 /etc/nginx/conf.d/，由 install-hk.sh 安装）
# 只加宿主机 nginx.conf 里没有的指令，避免 "duplicate directive" 导致 nginx -t 失败。
# 已有的 gzip/worker 配置保持原样，不动。

open_file_cache max=20000 inactive=60s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# 后台上传大文件（后台 location 里也有更精确的设置，这里兜底）
client_max_body_size 2048m;
client_body_timeout 300s;
keepalive_timeout 65s;
